name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contratos legados (EVM)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - run: npm run compile
      - run: npm test
      - run: npm run coverage
      - run: npm run coverage:check
      # Coverage instrumenta os artefatos: recompilar antes do teste RPC.
      - run: npm run compile -- --force
      - run: npm run test:local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-contratos
          path: |
            contracts/coverage/
            contracts/coverage.json
            contracts/coverage-summary.json
          if-no-files-found: ignore

